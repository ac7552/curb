# Solid Queue recurring jobs. Bulk MOT files are published monthly and loaded with
# `bin/rails curb:import:mot`; these keep categories and rate tables current in between.
production:
  categorize_defect_phrases:
    class: CategorizeDefectPhrasesJob
    queue: default
    schedule: every day at 2am
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12
