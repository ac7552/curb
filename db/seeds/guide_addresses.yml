# Maintenance booklets that cover every model a maker sold that year, at addresses that can't be built
# from the year and model, so they're listed by hand (MaintenanceGuides::Sources::AddressFile).
#
#   years:  one year (2021) or a range ("2020-2021")
#   models: the models a booklet covers, when it isn't every model that year
#   kind:   all_models_booklet unless stated
#
# Checked 2026-10-03; each address returned a PDF. Fill in the missing years by finding the booklet on the
# maker's site. Not here because they refuse programs: BMW and MINI (bmwusa.com), Volvo (volvocars.com).
# Not here because the booklet has no schedule: Porsche, whose public warranty manual points to a
# Maintenance Booklet that isn't published.
Subaru:
  - { years: 2019, url: "https://techinfo.subaru.com/stis/doc/warrantyBooklet/2019_war_and_maint_032019_S209_wHybridSup-2.pdf", title: "Subaru 2019 Warranty and Maintenance Booklet" }
  - { years: 2020, url: "https://techinfo.subaru.com/stis/doc/warrantyBooklet/2020_war_and_maint__020720.pdf", title: "Subaru 2020 Warranty and Maintenance Booklet" }
  - { years: 2021, url: "https://techinfo.subaru.com/stis/doc/warrantyBooklet/2021_war_and_maint__081120.pdf", title: "Subaru 2021 Warranty and Maintenance Booklet" }
